name: SHItemsBoosts
version: '${project.version}'
main: org.Cry_Legende.sHItemsBoosts.SHItemsBoosts
api-version: '1.20'
author: Cry_Legende
description: Ajoute des boosts d'items dans une arène.

commands:
  shitemsboosts:
    description: Commande principale du plugin SHItemsBoosts.
    aliases: [shib]
    permission: shitemsboosts.admin
    usage: |
      /shib add - Ajoute un point d'apparition à votre position.
      /shib remove <id> - Supprime un point d'apparition via son ID.
      /shib list - Liste tous les points d'apparition de manière interactive.
      /shib reload - Recharge la configuration du plugin.

permissions:
  shitemsboosts.admin:
    description: Donne accès à toutes les commandes d'administration de SHItemsBoosts.
    default: op

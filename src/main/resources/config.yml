# SHItemsBoosts
#
# Fait apparaître, sur des points d'apparition posés par les admins (locations.yml), des items flottants qui donnent
# un effet de potion au joueur qui s'en approche. Les boosts, leurs poids et leurs sons sont définis plus bas ; les
# textes sont dans messages.yml.
#
# Commandes (alias : /shib) :
#   /shitemsboosts add                   Ajoute un point d'apparition à votre position.
#   /shitemsboosts remove <id>           Supprime un point d'apparition.
#   /shitemsboosts list                  Liste les points (cliquable pour se téléporter ou supprimer).
#   /shitemsboosts tp <id>               Vous téléporte à un point.
#   /shitemsboosts forcecleanup [monde]  Supprime les anciens items orphelins du monde (le vôtre par défaut).
#   /shitemsboosts inspect               Affiche les infos de l'item le plus proche.
#   /shitemsboosts reload                Recharge config.yml et messages.yml, retire les boosts posés puis les repose.
#                                        locations.yml n'est pas relu : il est réécrit à chaque ajout ou retrait.
#
# Permissions (op par défaut) :
#   shitemsboosts.admin               Toute l'administration.
#   shitemsboosts.admin.add           add.
#   shitemsboosts.admin.remove        remove.
#   shitemsboosts.admin.list          list.
#   shitemsboosts.admin.tp            tp.
#   shitemsboosts.admin.forcecleanup  forcecleanup.
#   shitemsboosts.admin.inspect       inspect.
#   shitemsboosts.admin.reload        reload.

settings:
  # Nombre maximum de boosts actifs en même temps sur la carte.
  max-concurrent-items: 50
  # Hauteur à laquelle l'item flotte au-dessus du point de spawn défini (en blocs).
  spawn-height-offset: 1.0
  # Intervalle en ticks (20 ticks = 1 seconde) pour vérifier si un joueur est proche d'un item.
  # Une valeur plus basse est plus réactive mais consomme plus de ressources.
  pickup-check-interval-ticks: 10
  # Intervalle en secondes pour essayer de faire apparaître un nouvel item s'il y a de la place.
  spawn-check-interval-seconds: 3
  # Rayon de détection pour ramasser l'item (en blocs).
  pickup-radius: 2
  # Fait apparaître d'un coup tous les boosts possibles au démarrage et après un /shitemsboosts reload, au lieu
  # d'un toutes les spawn-check-interval-seconds.
  startup-burst: true

sound:
  # Faut-il jouer un son aux joueurs proches lorsqu'un nouvel item apparaît ?
  play-sound-on-spawn: true
  # Le son joué lors de l'apparition. Liste des sons : https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html
  spawn-sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
  # Le volume du son d'apparition.
  spawn-sound-volume: 0.5
  # La tonalité (pitch) du son d'apparition.
  spawn-sound-pitch: 2
  # Le rayon (en blocs) dans lequel les joueurs entendront le son d'apparition.
  spawn-sound-radius: 25

# --- Définition des boosts ---
# Plus le poids est élevé, plus le boost est commun.
# Exemple : un boost avec un poids de 50 a 5 fois plus de chance d'apparaître qu'un boost avec un poids de 10.
boosts:

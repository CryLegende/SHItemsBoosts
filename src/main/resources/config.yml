    item-type: "SUGAR"
    display-name: "&b&lVitesse II"
    enchanted: true
    effect-type: "SPEED"
    duration-seconds: 5
    amplifier: 1 # Niveau 2
    weight: 40 # Commun
    pickup-message: "&7&l« &a&lSH &8&l» &fBoost reçu: &b%boost_name% &7(&b%duration%s&7)"
